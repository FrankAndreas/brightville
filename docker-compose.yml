# Brightville on a NAS (or any Docker host), with the image published by CI.
# Copy it to the app folder on the NAS as compose.yaml; see docs/deploy-nas.md.
#
# The app is static (nginx serving the built files) and keeps no data, so it
# needs no volumes or .env. The image brings its own healthcheck and runs as a
# non-root user.
#
# To try your local changes instead: docker compose up -d --build

services:
  brightville:
    image: ghcr.io/frankandreas/brightville:latest
    build: .
    container_name: brightville
    ports:
      - "${PORT:-8087}:8080"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
