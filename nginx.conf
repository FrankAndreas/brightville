server {
    listen 8080;
    server_name localhost;

    root /usr/share/nginx/html;

    gzip on;
    gzip_types text/css application/javascript application/json application/wasm application/manifest+json image/svg+xml;
    gzip_min_length 1024;

    # index.html is checked with the server on every load, so the iPad gets a new version right after an update
    location / {
        index index.html;
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        include /etc/nginx/security-headers.conf;
    }

    # Built files carry their content hash in the name, so a new version has a new name
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        include /etc/nginx/security-headers.conf;
    }

    # The game's server ('backend' is the compose service name). A backend that is down is reported at once, so the
    # page shows its sleeping cloud instead of hanging
    location /api/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://backend:8000;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The body-tracking model and its WebAssembly (some 15 MB): fixed names, so not forever
    location /mediapipe/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
        include /etc/nginx/security-headers.conf;
    }
}
