# Security headers, included in every location: nginx drops server-level add_header lines in a location that has its
# own. "always" also puts them on error answers.
# - CSP: everything comes from the app itself. 'wasm-unsafe-eval' lets the physics engine and the body tracking run
#   their WebAssembly; Vue's style attributes need 'unsafe-inline' for styles; blob: is for the camera picture.
#   The Cinema: YouTube's privacy-enhanced player in a frame, and the films' pictures from i.ytimg.com.
# - Permissions-Policy: the camera for the game's own page only (Yoga); the Cinema's player may start by itself,
#   go full screen and play protected films.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://i.ytimg.com; frame-src https://www.youtube-nocookie.com; media-src 'self' blob:; connect-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), autoplay=(self \"https://www.youtube-nocookie.com\"), fullscreen=(self \"https://www.youtube-nocookie.com\"), encrypted-media=(self \"https://www.youtube-nocookie.com\"), picture-in-picture=(self \"https://www.youtube-nocookie.com\")" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
