# Security headers, included in every location: nginx drops server-level add_header lines in a location that has its
# own. "always" also puts them on error answers.
# - CSP: everything comes from the app itself. 'wasm-unsafe-eval' lets the physics engine and the body tracking run
#   their WebAssembly; Vue's style attributes need 'unsafe-inline' for styles; blob: is for the camera picture.
# - Permissions-Policy: the camera for the game's own page only (Yoga), nothing else.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' data:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
